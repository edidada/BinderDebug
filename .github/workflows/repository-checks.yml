name: Repository checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Verify project prerequisites
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Android SDK 23
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-23' 'build-tools;23.0.2'

      - name: Install Android NDK r10e
        shell: bash
        run: |
          set -euo pipefail
          ndk_archive="$RUNNER_TEMP/android-ndk-r10e-linux-x86_64.zip"
          ndk_dir="$RUNNER_TEMP/android-ndk-r10e"
          curl --fail --location --retry 3 --output "$ndk_archive" \
            https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q "$ndk_archive" -d "$RUNNER_TEMP"
          test -x "$ndk_dir/ndk-build"
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_dir" >> "$GITHUB_ENV"

      - name: Set up Java 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Configure legacy Android Gradle plugin
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "ndk.dir=$ANDROID_NDK_HOME"
          } > local.properties

      - name: Verify Android and Binder debug assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            gradlew
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/jni/ExampleService.cpp
            app/src/main/jni/binder_ndk.cpp
            binder_lib/libs/libbinder.so
            binder_lib/libs/libc.so
            binder_lib/libs/libcutils.so
            binder_lib/libs/libutils.so
            binder_lib/include/binder/IBinder.h
            binder_lib/include/utils/RefBase.h
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
            echo "Verified $file"
          done

          test -x gradlew
          grep -q 'gradle-2.10-all.zip' gradle/wrapper/gradle-wrapper.properties
          grep -q "compileSdkVersion = 23" app/build.gradle

      - name: Build ARM debug APK
        shell: bash
        run: ./gradlew --no-daemon assembleArmDebug

      - name: Verify APK output
        shell: bash
        run: test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
