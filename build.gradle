// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        // gradle-experimental 0.7.0-alpha1 was published only to JCenter,
        // which is no longer available. These mirrors retain the archived
        // artifacts required by this legacy project.
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'  // 匹配 Gradle 4.6

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files


    }
}

allprojects {
    repositories {
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        mavenCentral()


    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
